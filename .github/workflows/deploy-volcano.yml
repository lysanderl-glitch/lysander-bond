name: Deploy to Volcano (synapsehd.com)

# 硬规则（2026-11-15，不许逾越）：火山服务器只发布静态网页（dist/）。
# 不得在火山服务器上部署后端、运行 Claude、或运行任何调用 Claude 的程序。
# 数字分身、照片、视频等动态功能只在腾讯 Lighthouse（https://lysander.bond/me/）。
# push to main 自动触发 + 手动备用触发
# ⚠️ 前置条件：GitHub 仓库 Settings → Secrets → VOLCANO_SSH_KEY 需总裁手动配置
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with synapsehd.com SITE_URL
        run: npm run build
        env:
          SITE_URL: https://synapsehd.com

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VOLCANO_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VOLCANO_SSH_PORT }}" -H 118.196.41.252 >> ~/.ssh/known_hosts

      - name: Rsync dist/ to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.VOLCANO_SSH_PORT }} -o StrictHostKeyChecking=no" \
            dist/ \
            root@118.196.41.252:/home/synapsehd-website/dist/

      - name: Reload nginx
        run: |
          ssh -p "${{ secrets.VOLCANO_SSH_PORT }}" -o StrictHostKeyChecking=no root@118.196.41.252 "nginx -t && systemctl reload nginx"

      - name: Set Cache-Control headers via nginx conf.d snippet
        run: |
          ssh -p "${{ secrets.VOLCANO_SSH_PORT }}" -o StrictHostKeyChecking=no root@118.196.41.252 \
            "printf 'add_header Cache-Control \"no-cache, must-revalidate\" always;\n' > /etc/nginx/conf.d/cache-headers.conf && nginx -t && systemctl reload nginx"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sIL --max-time 15 https://synapsehd.com/ || \
            curl -sIL --max-time 15 http://www.synapsehd.com/ | head -3
